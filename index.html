<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de Algoritmia</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section>
        <form id="form">
            <h3>Recogida de datos</h3>
            
            <label for="precioArticulo">Precio Articulo:</label>
            <input type="number" id="precioArticulo" name="precioArticulo"    placeholder="20" step="any" required>

            <label for="importePagado">Importe Pagado:</label>
            <input type="number" id="importePagado" name="importePagado"   placeholder="20,22" step="any" required>

            <label for="billetesEntregados" >Billetes Entregados:</label>
            <input type="text" id="billetesEntregados" name="billetesEntregados"    placeholder="1 billete de 10" required>
            <button type="submit">Enviar datos</button>
        </form>
    </section>
</body>
</html>
